name: Deploy Backend

on:
  push:
    branches: [main, dev]
    tags: ["v*"]

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-backend-image:
    name: Publish backend image to ghcr.io
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev' ||
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/openspeak-backend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy dev backend
    runs-on: ubuntu-latest
    needs: [publish-backend-image]
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Trigger dev Coolify redeploy
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "${{ secrets.COOLIFY_DEV_WEBHOOK_URL }}&force=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

  deploy-production:
    name: Deploy production backend
    runs-on: ubuntu-latest
    needs: [publish-backend-image]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger production Coolify redeploy
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "${{ secrets.COOLIFY_PROD_WEBHOOK_URL }}&force=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
